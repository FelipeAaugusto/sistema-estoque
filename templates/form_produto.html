<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if produto %}Editar Produto{% else %}Novo Produto{% endif %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>{% if produto %} Editar Produto{% else %} Novo Produto{% endif %}</h1>
        <a href="{{ url_for('index') }}" class="btn secundario">← Voltar</a>
    </header>

    <main>

        {% if erro %}
        <div class="alerta-erro">
            ⚠️ {{ erro }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('editar_produto', id=produto['id']) if produto else url_for('novo_produto') }}" class="formulario">
            <label>
                Nome *
                <input type="text" name="nome" required value="{{ produto['nome'] if produto else '' }}">
            </label>

            <label>
                Descrição
                <textarea name="descricao" rows="3">{{ produto['descricao'] if produto else '' }}</textarea>
            </label>

            <label>
                Categoria
                <input type="text" name="categoria" placeholder="ex: Eletrônicos" value="{{ produto['categoria'] if produto else '' }}">
            </label>

            <div class="linha">
                <label>
                    Quantidade *
                    <input type="number" name="quantidade" min="0" value="{{ produto['quantidade'] if produto else '0' }}" required>
                </label>

                <label>
                    Preço (R$) *
                    <input type="text" name="preco" placeholder="0.00" required pattern="^[0-9]+([.,][0-9]+)?$" title="Digite apenas números. Ex: 10.50 ou 10,50" value="{{ '%.2f'|format(produto['preco']) if produto else '' }}">
                </label>

                <label>
                    Estoque mínimo
                    <input type="number" name="estoque_minimo" min="0" value="{{ produto['estoque_minimo'] if produto else '0' }}">
                </label>
            </div>

            <button type="submit" class="btn">{% if produto %}Salvar Alterações{% else %}Salvar Produto{% endif %}</button>
        </form>
    </main>
</body>
</html>
